name: market-sentinel

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  API_PORT: ${API_PORT:-3001}
  WEB_PORT: ${WEB_PORT:-3000}
  APP_PASSWORD: ${APP_PASSWORD}
  ETORO_API_KEY: ${ETORO_API_KEY}
  ETORO_USER_KEY: ${ETORO_USER_KEY}
  ETORO_ACCOUNT_TYPE: ${ETORO_ACCOUNT_TYPE:-real}
  DEMO_EXECUTION_ENABLED: ${DEMO_EXECUTION_ENABLED:-false}
  ETORO_REST_BASE_URL: ${ETORO_REST_BASE_URL:-https://public-api.etoro.com}
  ETORO_WS_URL: ${ETORO_WS_URL:-wss://ws.etoro.com/ws}
  STALE_TICK_MS: ${STALE_TICK_MS:-15000}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    profiles: ["migrate"]
    image: ${IMAGE_HOST:-market-sentinel}/migrate:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: migrate
    environment:
      <<: *app-environment
      DATABASE_URL: ${DATABASE_DIRECT_URL:-${DATABASE_URL}}

  api:
    image: ${IMAGE_HOST:-market-sentinel}/api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      <<: *app-environment
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    image: ${IMAGE_HOST:-market-sentinel}/worker:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: worker
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    image: ${IMAGE_HOST:-market-sentinel}/web:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        API_INTERNAL_URL: http://api:3001
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://api:3001
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
  caddy_config:
